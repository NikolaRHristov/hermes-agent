name: aphrodite
repo: https://github.com/PlayForm/Aphrodite-Hermes
sha: e95afcd9d99360fdf73ecdd2f540af7cd81597ec
description: "CCR compression plugin - 28-type classifier, 13 tools, opt-in context engine, TOML-driven templates. Disclosure - pre_tool_call auto-backgrounds long terminal/process commands (modify: background=true, notify_on_complete=true) and rewrites chained terminal commands when enabled."
maintainer: NikolaRHristov
tier: community
category: tools
requires_hermes: ">=0.20.2"
docs_url: https://github.com/PlayForm/Aphrodite-Hermes#readme
version: "2.2.6"
capabilities:
  provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_directive
  - aphrodite_test
  - aphrodite_catalog
  - aphrodite_reclassify
  - aphrodite_prefetch
  - aphrodite_prefetch_status
  provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - APHRODITE_API_KEY