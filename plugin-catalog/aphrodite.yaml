name: aphrodite
repo: https://github.com/PlayForm/Aphrodite-Hermes
sha: 17dfa4df9102d7e3dc6b02c8720d85f7fc3a3298
description: CCR compression plugin - 28-type classifier, 13 tools, context engine, TOML-driven templates.
maintainer: NikolaRHristov
tier: community
category: tools
requires_hermes: ">=0.16.0"
docs_url: https://github.com/PlayForm/Aphrodite-Hermes#readme
version: "2.2.5"
capabilities:
  provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_directive
  - aphrodite_test
  - aphrodite_catalog
  - aphrodite_reclassify
  - aphrodite_prefetch
  - aphrodite_prefetch_status
  provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - APHRODITE_API_KEY